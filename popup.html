<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插件配置</title>
    <style>
        body {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* 固定列宽 */
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            vertical-align: middle;
            white-space: nowrap; /* 防止内容换行 */
            overflow: hidden; /* 超出部分隐藏 */
            text-overflow: ellipsis; /* 超出部分显示省略号 */
        }
        th {
            background-color: #f2f2f2;
        }
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
        }
        .status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<h2>插件配置</h2>
<form id="configForm">
    <table>
        <thead>
        <tr>
            <th>下注类型</th>
            <th>最小数学期望</th>
            <th>下注金额</th>
            <th>是否下注</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>幸运女皇</td>
            <td><input type="text" id="luckyQueueOdds" value="1.05"></td>
            <td><input type="number" id="luckQueueBet" value="160"/></td>
            <td><input type="checkbox" id="luckyQueue" checked></td>
        </tr>
        <tr>
            <td>烫三手</td>
            <td><input type="text" id="hotThreeOdds" value="1.05"></td>
            <td><input type="number" id="hotThreeBet" value="160"/></td>
            <td><input type="checkbox" id="hotThree" checked></td>
        </tr>
        <tr>
            <td>幸运三</td>
            <td><input type="text" id="luckyThreeOdds" value="1.05"></td>
            <td><input type="number" id="luckyThreeBet" value="160"/></td>
            <td><input type="checkbox" id="luckyThree" checked></td>
        </tr>
        <tr>
            <td>爆牌</td>
            <td><input type="text" id="bloomOdds" value="1.05"></td>
            <td><input type="number" id="bloomBet" value="160"/></td>
            <td><input type="checkbox" id="bloom" checked></td>
        </tr>
        <tr>
            <td>对子</td>
            <td><input type="text" id="pairOdds" value="1.05"></td>
            <td><input type="number" id="pairBet" value="160"/></td>
            <td><input type="checkbox" id="pair" checked></td>
        </tr>
        <tr>
            <td>底注</td>
            <td><input type="text" id="commonOdds" value="1.05"></td>
            <td><input type="number" id="commonBet" value="20"/></td>
            <td><input type="checkbox" id="common" checked></td>
        </tr>
        </tbody>
    </table>
    <button type="submit">保存配置</button>
</form>
<div class="status">
    <p id="statsInfo">统计信息: 已选择 0 项，共填写 0 个输入框</p>
    <p id="currentStatus">当前状态: 未保存</p>
</div>
<script src="popup.js"></script>
</body>
</html>
